# Render Blueprint — Evertrust ERP API + Postgres (the half Vercel can't host).
# The web (apps/web) deploys separately on Vercel, pointed at this API's URL.
#
# One-time: Render Dashboard → New → Blueprint → connect this repo. Render reads
# this file and provisions the Postgres DB, the API service, and its upload disk.
# Then fill the `sync: false` secrets in the dashboard and trigger a deploy.
#
# FREE-TIER config ($0): free Postgres + free web service, no persistent disk.
# Tradeoffs: the API sleeps after ~15 min idle (cold starts), the DB is auto-deleted
# after ~30 days, and uploads go to ephemeral /tmp (lost on restart). Upgrade later
# by setting db.plan: basic-256mb, plan: starter, and re-adding the disk block.
#
# Notes baked in from the repo:
#  - dockerfilePath/dockerContext mirror infra/docker-compose.yml (context = repo root).
#  - Free tier has no pre-deploy hook and no Shell, so dockerCommand runs Drizzle
#    migrate + seed (both idempotent) at startup, then launches the API. migrate
#    also enables pgvector via migration 0000; seed creates the bootstrap admin once.
#  - The app listens on Render's injected $PORT automatically (config reads PORT).

databases:
  - name: evertrust-db
    plan: free               # FREE: auto-deleted after ~30 days, 1GB, no backups. Upgrade -> basic-256mb.
    postgresMajorVersion: "16"
    region: frankfurt        # EU data residency (Evertrust GmbH). Keep API in the same region.

services:
  - type: web
    name: evertrust-api
    runtime: docker
    region: frankfurt
    plan: free               # FREE: sleeps after ~15 min idle (cold starts). Upgrade -> starter for always-on.
    dockerfilePath: ./infra/Dockerfile.node
    dockerContext: .
    # Free tier has no pre-deploy hook / Shell, so run migrate + seed (both
    # idempotent) at startup, then launch the API. Safe to re-run every cold start.
    dockerCommand: corepack pnpm --filter @evertrust/db db:migrate && corepack pnpm --filter @evertrust/db db:seed && corepack pnpm --filter @evertrust/db exec node --import tsx /app/apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    # (no persistent disk — free instances can't attach one; uploads use ephemeral
    # /tmp and are lost on restart. Add a disk + a paid plan for durable uploads.)
    envVars:
      # --- core ---------------------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: evertrust-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOG_LEVEL
        value: info
      # Cross-site auth cookie: the web (Vercel) and API (Render) are on different
      # sites, so the session cookie must be SameSite=None + Secure to ride along.
      # (Switch SAMESITE back to 'lax' once web+api share a root domain.)
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Set to your Vercel URL(s), comma-separated, AFTER the web is deployed:
      #   https://evertrust-erp.vercel.app,https://app.yourdomain.com
      - key: CORS_ORIGINS
        sync: false
      # --- n8n observability poller / backfill (Marketing sync needs these) ---
      - key: N8N_API_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      # Must MATCH the x-arsenal-token your n8n callback nodes send:
      - key: ARSENAL_INGEST_TOKEN
        sync: false
      # --- n8n arsenal trigger webhooks (blank = that trigger disabled) -------
      - key: N8N_AIM_WEBHOOK_URL
        sync: false
      - key: N8N_LEAD_SATELLITE_WEBHOOK_URL
        sync: false
      - key: N8N_AMMO_FORGE_WEBHOOK_URL
        sync: false
      - key: N8N_REACH_BAZOOKA_WEBHOOK_URL
        sync: false
      - key: N8N_REPLY_GLOCK_WEBHOOK_URL
        sync: false
      - key: N8N_SLEEPER_GRENADE_WEBHOOK_URL
        sync: false
      # --- Key Account hot-leads webhooks ------------------------------------
      - key: N8N_PROVISION_HOT_LEADS_WEBHOOK_URL
        sync: false
      - key: N8N_HOT_LEADS_PIPELINE_WEBHOOK_URL
        sync: false
      # --- supplier RFQ (Hermes) ---------------------------------------------
      - key: N8N_HERMES_RFQ_WEBHOOK_URL
        sync: false
      # --- Claude price-assist (blank = feature off) -------------------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-latest
